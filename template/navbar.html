<header class="navbar">
    <a href="/pathe_rillette/dashboard" class="logo">Pathe &amp; Rillettes</a>
    <nav class="menu" aria-label="Main">
        <a href="/pathe_rillette/movie/add" title="Add a movie">
            <i class="fas fa-plus" aria-hidden="true"></i><span class="label">Add a movie</span>
        </a>
        <a href="/pathe_rillette/login" title="Log out">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i><span class="label">Log out</span>
        </a>
    </nav>
    <form id="form-nav" method="GET" role="search">
        <input name="search" type="search" placeholder="Search..." aria-label="Search a movie" autocomplete="off">
        <button type="submit" class="search-icon" aria-label="Search">
            <i class="fas fa-search" aria-hidden="true"></i>
        </button>
    </form>
</header>
<script>
    (function() {
        var form = document.getElementById('form-nav');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var q = form.elements['search'].value.trim();
            if (q === '') return;
            window.location.href = '/pathe_rillette/movie/search/' + encodeURIComponent(q);
        });
    })();
</script>
