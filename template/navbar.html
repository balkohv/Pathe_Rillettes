        <a href="/pathe_rillette/dashboard" class="logo">

<script src="/pathe_rillette/jquery-3.7.1.min.js"></script>
<script>

        $('.search-icon').click(function() {
            window.location.href = '/pathe_rillette/movie/search/' + $('input[name="search"]').val();

        });

</script>
